<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stick Hero - Stick Man HTML5 Canvas Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
</head>
<body>
    <div class="container">
        <div id="score">0</div>
        <canvas id="game" width="375" height="375"></canvas>
        <div id="introduction">Hold down the mouse or tap to stretch out a stick</div>
        <div id="perfect">DOUBLE SCORE</div>
        <button id="restart">RESTART</button>
    </div>

    <a id="youtube" href="https://youtu.be/eue3UdFvwPo" target="_blank" rel="noopener noreferrer">
        <span>See how this game was made</span>
    </a>
    <div id="youtube-card">
        How to create a Stick Hero game with JavaScript and HTML Canvas
    </div>

    <script src="script.js"></script>
</body>
</html>
